{{- if or .Params.math .Site.Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
  onload="renderMathInElement(document.body, {throwOnError: false, strict: 'ignore', delimiters: [
    {left: '\\(', right: '\\)', display: false},
    {left: '\\[', right: '\\]', display: true}
  ]});"></script>
{{- end }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..800&display=swap">

<style>
.header-nav {
  max-width: calc(1220px + var(--gap) * 2);
  font-family: "EB Garamond", Georgia, serif;
}

.logo a {
  font-size: calc(2rem + 3px);
  font-weight: 600;
}

.menu a {
  font-size: calc(1.2rem + 3px);
  font-weight: 500;
}

.main:has(> .post-single) {
  max-width: calc(1220px + var(--gap) * 2);
}

.post-single {
  font-family: "EB Garamond", Georgia, serif;
  font-size: calc(1.4rem + 3px);
  line-height: 1.6;
}

.list {
  background: var(--theme);
}

.home-info {
  min-height: 0;
  padding: 1.5rem 0 2.5rem;
}

.home-info .entry-header h1 {
  font-size: 32px;
  letter-spacing: -0.02em;
}

.list .post-entry {
  margin-bottom: 20px;
  padding: 20px;
  background: var(--entry);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: background 0.2s ease;
}

.list .post-entry:hover,
.list .post-entry:focus-within {
  background: var(--tertiary);
}

.list .entry-header h2 {
  font-size: 28px;
  line-height: 1.25;
}

.list .entry-content {
  margin: 10px 0;
  font-size: 20px;
  line-height: 1.7;
  -webkit-line-clamp: 2;
}

.list .entry-footer {
  font-size: 17px;
}

.list .post-entry:hover .entry-header h2 {
  text-decoration: none;
}

.post-title {
  font-size: calc(2.66rem + 3px);
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: normal;
}

.post-meta,
.breadcrumbs {
  font-size: calc(1rem + 3px);
}

.breadcrumbs a {
  font-size: calc(1.05rem + 3px);
}

details.toc summary {
  font-size: calc(1.25rem + 3px);
}

.post-content {
  font-size: 1em;
  line-height: 1.6;
}

.post-content h2 {
  font-size: calc(2.24rem + 3px);
}

.post-content h3 {
  font-size: calc(1.89rem + 3px);
}

.post-content .concept-equation {
  margin: 1.75rem auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.95em;
  line-height: 1.5;
  text-align: center;
}

.post-content .katex-display,
.post-content table {
  max-width: 100%;
  box-sizing: border-box;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
}

.post-content .katex-display {
  padding: 0.15rem 0 0.35rem;
  scrollbar-width: thin;
}

.post-content .katex-display::-webkit-scrollbar {
  height: 4px;
}

.post-content .katex-display::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 999px;
}

.post-content .article-figure {
  margin: 2.25rem 0;
}

.post-content .article-figure img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
}

.post-content .article-figure-plain img {
  width: auto;
  max-width: 100%;
  margin-inline: auto;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.post-content .article-figure-narrow {
  max-width: 56rem;
  margin-inline: auto;
}

.post-content .article-figure-responsive picture {
  display: block;
}

.post-content .article-figure-responsive img {
  width: 100%;
  object-fit: contain;
}

.post-content .article-image-link {
  display: block;
}

.post-content .article-figure figcaption {
  margin: 0.75rem auto 0;
  max-width: 52rem;
  color: var(--secondary);
  font-size: 0.9em;
  line-height: 1.5;
  text-align: center;
}

.post-content .eval-spec {
  box-sizing: border-box;
  margin: 1.5rem 0 var(--content-gap);
  padding: 1.25rem 1.4rem;
  overflow-x: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #f6f8fa;
  color: #24292f;
  box-shadow: none;
  font-size: 0.88em;
  line-height: 1.55;
  white-space: pre;
}

.post-content .release-gate {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 1rem;
  margin: 1.5rem 0 var(--content-gap);
}

.post-content .release-gate-rule {
  padding: 1.1rem 1.2rem 0.35rem;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--entry);
}

.post-content .release-gate-rule strong {
  display: block;
  margin-bottom: 0.65rem;
  color: var(--primary);
}

.post-content .release-gate-rule ul {
  margin-bottom: 0.75rem;
  padding-inline-start: 1.25rem;
}

.post-content .release-gate-rule li {
  margin-top: 0.35rem;
}

.post-content .release-gate-block {
  border-top: 3px solid #c2413b;
}

.post-content .release-gate-allow {
  border-top: 3px solid #2f7d4a;
}

.post-content .article-figure-hero {
  margin-top: 2rem;
}

@media (max-width: 700px) {
  .post-content .release-gate {
    grid-template-columns: 1fr;
  }

  .logo a {
    font-size: calc(1.7rem + 3px);
  }

  .menu a {
    font-size: calc(1.05rem + 3px);
  }

  .post-single {
    font-size: calc(1.2rem + 3px);
  }

  .post-title {
    font-size: calc(2.1rem + 3px);
  }

  .post-content h2 {
    font-size: calc(1.92rem + 3px);
  }

  .post-content h3 {
    font-size: calc(1.62rem + 3px);
  }

  .post-content {
    font-size: 1em;
  }

  .post-content .katex-display {
    text-align: left;
  }

  .post-content table {
    display: block;
    width: 100%;
  }
}

</style>
