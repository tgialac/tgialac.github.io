{{- if or .Params.math .Site.Params.math }}
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" crossorigin="anonymous"
  onload="renderMathInElement(document.body, {throwOnError: false, strict: 'ignore', delimiters: [
    {left: '$$', right: '$$', display: true},
    {left: '$', right: '$', display: false},
    {left: '\\(', right: '\\)', display: false},
    {left: '\\[', right: '\\]', display: true}
  ]});"></script>
{{- end }}
{{- if and .IsPage (eq .Section "posts") }}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400..800&display=swap">
{{- end }}

<style>
.main:has(> .post-single) {
  max-width: calc(1040px + var(--gap) * 2);
}

.post-single {
  font-family: "EB Garamond", Georgia, serif;
  font-size: 1.3rem;
  line-height: 1.62;
}

.list {
  background: var(--theme);
}

.home-info {
  min-height: 0;
  padding: 1.5rem 0 2.5rem;
}

.home-info .entry-header h1 {
  font-size: 32px;
  letter-spacing: -0.02em;
}

.list .post-entry {
  margin-bottom: 20px;
  padding: 20px;
  background: var(--entry);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: background 0.2s ease;
}

.list .post-entry:hover,
.list .post-entry:focus-within {
  background: var(--tertiary);
}

.list .entry-header h2 {
  font-size: 28px;
  line-height: 1.25;
}

.list .entry-content {
  margin: 10px 0;
  font-size: 20px;
  line-height: 1.7;
  -webkit-line-clamp: 2;
}

.list .entry-footer {
  font-size: 17px;
}

.list .post-entry:hover .entry-header h2 {
  text-decoration: none;
}

.post-title {
  font-size: 1.8em;
  font-weight: 600;
  line-height: 1.2;
  letter-spacing: normal;
}

.post-content {
  font-size: 1em;
  line-height: 1.62;
}

.post-content h2 {
  font-size: 1.6em;
}

.post-content h3 {
  font-size: 1.3em;
}

.post-content .concept-equation {
  margin: 1.75rem auto;
  font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
  font-size: 0.95em;
  line-height: 1.5;
  text-align: center;
}

.post-content .agent-trace {
  display: grid;
  justify-items: center;
  gap: 0.2rem;
  margin: 2rem auto 2.5rem;
}

.post-content .agent-trace-node {
  min-width: 12rem;
  max-width: 100%;
  padding: 0.45rem 1.25rem;
  border: 1px solid var(--border);
  border-radius: 999px;
  color: var(--primary);
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
}

.post-content .agent-trace-boundary {
  background: rgba(79, 160, 230, 0.16);
}

.post-content .agent-trace-decision {
  background: rgba(244, 129, 129, 0.16);
}

.post-content .agent-trace-action {
  background: rgba(244, 186, 71, 0.16);
}

.post-content .agent-trace-context {
  background: rgba(79, 190, 116, 0.16);
}

.post-content .agent-trace-arrow {
  color: var(--secondary);
  font-size: 1.1rem;
  line-height: 1;
}

.post-content .katex-display,
.post-content table {
  max-width: 100%;
  box-sizing: border-box;
  overflow-x: auto;
  overflow-y: hidden;
  -webkit-overflow-scrolling: touch;
}

.post-content .katex-display {
  padding: 0.15rem 0 0.35rem;
  scrollbar-width: thin;
}

.post-content .katex-display::-webkit-scrollbar {
  height: 4px;
}

.post-content .katex-display::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 999px;
}

.post-content .article-figure {
  margin: 2.25rem 0;
}

.post-content .article-figure img {
  display: block;
  width: 100%;
  height: auto;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: #fff;
  box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
}

.post-content .article-figure-plain img {
  width: auto;
  max-width: 100%;
  margin-inline: auto;
  border: 0;
  border-radius: 0;
  background: transparent;
  box-shadow: none;
}

.post-content .article-figure figcaption {
  margin: 0.75rem auto 0;
  max-width: 52rem;
  color: var(--secondary);
  font-size: 0.9em;
  line-height: 1.5;
  text-align: center;
}

.post-content .article-figure-hero {
  margin-top: 2rem;
}

@media (max-width: 700px) {
  .post-single {
    font-size: 1.15rem;
  }

  .post-title {
    font-size: 1.65em;
  }

  .post-content {
    font-size: 1em;
  }

  .post-content .katex-display {
    text-align: left;
  }

  .post-content table {
    display: block;
    width: 100%;
  }
}

</style>
