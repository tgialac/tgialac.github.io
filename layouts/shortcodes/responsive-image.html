{{- $source := resources.Get (.Get "src") -}}
{{- if not $source -}}
  {{- errorf "responsive-image: asset not found: %s" (.Get "src") -}}
{{- end -}}
{{- $small := $source.Resize "720x webp q82" -}}
{{- $medium := $source.Resize "1200x webp q82" -}}
{{- $large := $source.Resize "1672x webp q84" -}}
<figure class="{{ .Get "class" }}">
  <picture>
    <source type="image/webp" srcset="{{ $small.RelPermalink }} 720w, {{ $medium.RelPermalink }} 1200w, {{ $large.RelPermalink }} 1672w" sizes="(max-width: 700px) calc(100vw - 48px), 1217px">
    <img src="{{ $large.RelPermalink }}" width="{{ $large.Width }}" height="{{ $large.Height }}" loading="{{ .Get "loading" | default "lazy" }}"{{ with .Get "fetchpriority" }} fetchpriority="{{ . }}"{{ end }} decoding="async" alt="{{ .Get "alt" }}">
  </picture>
</figure>
